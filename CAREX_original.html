<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><meta name="theme-color" content="#126b67"><title>CAREX — Elderly Care</title>
<style>
*{box-sizing:border-box}body{margin:0;background:linear-gradient(135deg,#eaf8f6,#f4f7ff);font-family:Arial,sans-serif;color:#17343d}.app{max-width:480px;margin:auto;min-height:100vh;background:#fff;padding-bottom:88px;box-shadow:0 0 35px #d7e2e4}.header{background:linear-gradient(135deg,#126b67,#1c8b82);color:#fff;padding:24px 20px 28px;border-radius:0 0 28px 28px}.brand{font-size:32px;font-weight:900}.tag{opacity:.9;margin-top:4px}.hello{margin-top:22px;font-size:23px;font-weight:800}.sub{opacity:.85;margin-top:5px}.main{padding:18px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.big{min-height:126px;border:0;border-radius:20px;background:#eef7ff;font-size:17px;font-weight:800;padding:14px;cursor:pointer;box-shadow:0 5px 15px #dfe9eb}.big span{display:block;font-size:38px;margin-bottom:9px}.big:hover{transform:translateY(-2px)}.big.sos{background:#fff0f0}.big.special{background:#fff7df}.card,.status,.about{margin-top:16px;padding:18px;border-radius:20px;background:#f7fafb;box-shadow:0 5px 16px #e3eaeb}.section-title{font-size:20px;font-weight:900;margin-bottom:8px}.row{display:flex;justify-content:space-between;gap:12px;padding:12px 0;border-bottom:1px solid #dce6e8}.row:last-child{border:0}.pill{padding:5px 10px;border-radius:20px;background:#dff4ec;font-size:13px;font-weight:800}.page h1{font-size:27px;margin:12px 0 18px}.back{border:0;background:none;font-size:17px;font-weight:700;cursor:pointer;color:#126b67}label{display:block;font-weight:800;margin:12px 0 6px}input,select,textarea{width:100%;padding:14px;border:2px solid #d7e2e4;border-radius:13px;font-size:16px;background:#fff}textarea{min-height:110px;resize:vertical}.primary{width:100%;margin-top:15px;padding:16px;border:0;border-radius:14px;background:#126b67;color:#fff;font-size:17px;font-weight:900;cursor:pointer}.actions{display:flex;gap:8px}.actions button{flex:1;margin-top:10px;padding:12px;border:0;border-radius:11px;font-weight:800;cursor:pointer}.ok{background:#dff5e4}.later{background:#fff0d2}.call{background:#e5efff!important;color:#183b66!important}.danger{background:#e53935}.sosbox{text-align:center;padding:15px}.sosbutton{width:225px;height:225px;border-radius:50%;border:13px solid #ffd5d5;background:#e53935;color:#fff;font-size:45px;font-weight:900;cursor:pointer;box-shadow:0 10px 25px #eab5b5}.empty{text-align:center;color:#65777d;padding:22px}.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(480px,100%);background:#fff;border-top:1px solid #dce4e6;display:flex;z-index:10;box-shadow:0 -5px 18px #dfe7e8}.nav button{flex:1;border:0;background:#fff;padding:9px 2px;font-size:11px;font-weight:800;color:#456;cursor:pointer}.nav span{display:block;font-size:22px;margin-bottom:3px}.feature{display:flex;align-items:center;gap:12px;padding:13px;border-radius:15px;background:#fff;margin-top:9px}.feature-icon{font-size:29px}.note{font-size:13px;color:#607278}.check{font-size:22px;text-align:center;padding:25px}.mapbox{height:180px;border-radius:17px;background:linear-gradient(135deg,#dff1df,#e9f1ff);display:flex;align-items:center;justify-content:center;text-align:center;font-size:18px;font-weight:800;color:#315b55;margin-top:14px}.badge{display:inline-block;padding:5px 9px;border-radius:20px;background:#e8efff;color:#355; font-size:12px;font-weight:800}@media(min-width:700px){body{padding:20px}.app{border-radius:25px;overflow:hidden}}
</style></head><body><div class="app"><header class="header"><div class="brand">📱 CAREX</div><div class="tag">Care. Connect. Protect. ❤️</div><div class="hello">Hello! 👋</div><div class="sub">Simple care, safety & connection for seniors.</div></header><main id="main" class="main"></main><nav class="nav"><button onclick="home()"><span>🏠</span>Home</button><button onclick="medicine()"><span>💊</span>Medicine</button><button onclick="family()"><span>📞</span>Family</button><button onclick="doctor()"><span>🩺</span>Doctor</button><button onclick="checkin()"><span>❤️</span>Check-in</button></nav></div>
<script>
const M=document.getElementById('main');let meds=JSON.parse(localStorage.getItem('cxm')||'[]'),fams=JSON.parse(localStorage.getItem('cxf')||'[]'),docs=JSON.parse(localStorage.getItem('cxd')||'[]'),notes=JSON.parse(localStorage.getItem('cxnotes')||'[]'),routine=JSON.parse(localStorage.getItem('cxroutine')||'[]'),special=JSON.parse(localStorage.getItem('cxspecial')||'[]'),ok=localStorage.getItem('cxo')==='1',locationShared=localStorage.getItem('cxloc')==='1';function save(){localStorage.setItem('cxm',JSON.stringify(meds));localStorage.setItem('cxf',JSON.stringify(fams));localStorage.setItem('cxd',JSON.stringify(docs));localStorage.setItem('cxnotes',JSON.stringify(notes));localStorage.setItem('cxroutine',JSON.stringify(routine));localStorage.setItem('cxspecial',JSON.stringify(special));localStorage.setItem('cxo',ok?'1':'0');localStorage.setItem('cxloc',locationShared?'1':'0')}
function home(){M.innerHTML=`<div class="section-title">How can we help today?</div><div class="grid"><button class="big" onclick="medicine()"><span>💊</span>Medicine</button><button class="big sos" onclick="sos()"><span>🆘</span>Emergency SOS</button><button class="big" onclick="family()"><span>📞</span>Family</button><button class="big" onclick="doctor()"><span>🩺</span>Doctor</button><button class="big" onclick="checkin()"><span>❤️</span>Daily Check-in</button><button class="big special" onclick="specialCare()"><span>🧡</span>Special Care</button><button class="big" onclick="locationPage()"><span>📍</span>Location Sharing</button><button class="big" onclick="healthNote()"><span>📝</span>Health Notes</button><button class="big" onclick="dailyRoutine()"><span>📅</span>Daily Routine</button></div><div class="status"><div class="section-title">📊 Today's Status</div><div class="row"><b>💊 Medicine</b><span class="pill">${meds.some(x=>x.taken)?'Taken':'Pending'}</span></div><div class="row"><b>🩺 Doctor</b><span class="pill">${docs.length?'Upcoming':'None'}</span></div><div class="row"><b>❤️ Check-in</b><span class="pill">${ok?'Completed':'Pending'}</span></div><div class="row"><b>📍 Location</b><span class="pill">${locationShared?'Shared':'Off'}</span></div></div><div class="card"><div class="section-title">✨ CareX Features</div><div class="feature"><div class="feature-icon">🛡️</div><div><b>Safety first</b><div class="note">Quick SOS and family access.</div></div></div><div class="feature"><div class="feature-icon">🤝</div><div><b>Stay connected</b><div class="note">Family, doctor and daily check-ins.</div></div></div><div class="feature"><div class="feature-icon">🔒</div><div><b>Private demo data</b><div class="note">Saved locally in this browser.</div></div></div></div><div class="about"><b>About CAREX</b><p>To make elderly care simple, safe and more connected while helping senior citizens feel more independent in daily life.</p><b>Group Members</b><p>SHAULAT JAHAN<br>RIVA NAAZ</p></div>`}
function medicine(){M.innerHTML=`<div class="page"><button class="back" onclick="home()">← Back</button><h1>💊 Medicine Reminder</h1><label>Medicine name</label><input id="mn" placeholder="e.g. Paracetamol"><label>Dosage</label><input id="md" placeholder="e.g. 1 tablet"><label>Time</label><input id="mt" type="time"><label>Frequency</label><select id="mf"><option>Daily</option><option>Twice a day</option><option>Weekly</option></select><button class="primary" onclick="addMed()">🔔 Set Reminder</button>${meds.length?meds.map((m,i)=>`<div class="card"><b>💊 ${m.name}</b><p>🕐 ${m.time} · ${m.dose} · ${m.freq}</p><b>${m.taken?'✅ Taken':'🔔 Reminder Set'}</b><div class="actions"><button class="ok" onclick="take(${i})">✅ Taken</button><button class="later" onclick="alert('Demo: reminder postponed.')">⏰ Later</button></div></div>`).join(''):'<div class="empty">No medicines added yet.</div>'}</div>`}function addMed(){if(!mn.value.trim())return alert('Enter medicine name.');meds.push({name:mn.value,dose:md.value||'Dose not set',time:mt.value||'8:00 AM',freq:mf.value,taken:false});save();medicine()}function take(i){meds[i].taken=true;save();medicine()}
function sos(){M.innerHTML=`<div class="page"><button class="back" onclick="home()">← Back</button><h1>🚨 Emergency Help</h1><div class="sosbox"><p>Use SOS when emergency assistance is needed.</p><button class="sosbutton" onclick="confirmSOS()">SOS</button><p class="note">School-project demo — no real emergency call is placed.</p></div><div class="card"><b>Emergency Contact</b><p>${fams.length?fams[0].name+' · '+fams[0].phone:'No emergency contact added.'}</p><button class="primary" onclick="family()">➕ Add Contact</button></div></div>`}function confirmSOS(){if(confirm('Are you sure you want to start the emergency demo?'))alert('🚨 Demo SOS activated. No real call was made.')}
function family(){M.innerHTML=`<div class="page"><button class="back" onclick="home()">← Back</button><h1>📞 Family Calling</h1><label>Name</label><input id="fn" placeholder="e.g. Mom"><label>Relationship</label><input id="fr" placeholder="e.g. Mother"><label>Phone number</label><input id="fp" placeholder="Demo number"><button class="primary" onclick="addFam()">➕ Add Family Member</button>${fams.length?fams.map(f=>`<div class="card"><b>👤 ${f.name}</b><p>${f.rel}<br>📱 ${f.phone}</p><button class="primary call" onclick="callDemo()">📞 Call (Demo)</button></div>`).join(''):'<div class="empty">No family contacts added yet.</div>'}</div>`}function addFam(){if(!fn.value.trim())return alert('Enter a name.');fams.push({name:fn.value,rel:fr.value||'Family',phone:fp.value||'Demo number'});save();family()}function callDemo(){if(confirm('Start demo call?'))alert('📞 Demo call selected. No real call was made.')}
function doctor(){M.innerHTML=`<div class="page"><button class="back" onclick="home()">← Back</button><h1>🩺 Doctor Appointments</h1><label>Doctor's name</label><input id="dn" placeholder="e.g. Dr. Sharma"><label>Hospital/Clinic</label><input id="dh" placeholder="e.g. City Hospital"><label>Date</label><input id="dd" type="date"><label>Time</label><input id="dt" type="time"><label>Reason</label><input id="dr" placeholder="Reason for appointment"><button class="primary" onclick="addDoc()">🔔 Save Appointment</button>${docs.length?docs.map(d=>`<div class="card"><b>🩺 ${d.name}</b><p>📅 ${d.date}<br>🕐 ${d.time}<br>📍 ${d.hospital}<br>Reason: ${d.reason}</p></div>`).join(''):'<div class="empty">No upcoming appointments.</div>'}</div>`}function addDoc(){if(!dn.value.trim())return alert('Enter doctor name.');docs.push({name:dn.value,hospital:dh.value||'Clinic not set',date:dd.value||'25 September',time:dt.value||'10:30 AM',reason:dr.value||'General appointment'});save();doctor()}
function checkin(){M.innerHTML=`<div class="page"><button class="back" onclick="home()">← Back</button><h1>❤️ Daily Check-in</h1><div class="card check"><h2>Are you okay today?</h2><button class="primary" style="font-size:24px;padding:23px" onclick="doCheck()">✅ I'M OK</button><p>${ok?'Check-in completed! ❤️':'Your family can be shown your check-in status in this prototype.'}</p><b>${ok?'Last Check-in: Today':'Not completed today'}</b></div></div>`}function doCheck(){ok=true;save();checkin();alert('Check-in completed! ❤️')}
function locationPage(){M.innerHTML=`<div class="page"><button class="back" onclick="home()">← Back</button><h1>📍 Location Sharing</h1><div class="card"><div class="section-title">Share location with family</div><p class="note">This school-project prototype does not send your real location to anyone.</p><button class="primary" onclick="shareLocation()">${locationShared?'🟢 Location Sharing ON':'📍 Share My Location'}</button><button class="primary" style="background:#68777b" onclick="stopLocation()">Turn Off Sharing</button><div class="mapbox">🗺️<br>Demo location map<br><span class="badge">Prototype</span></div></div></div>`}function shareLocation(){locationShared=true;save();locationPage();alert('📍 Demo location sharing turned ON. No real location was sent.')}function stopLocation(){locationShared=false;save();locationPage()}
function healthNote(){M.innerHTML=`<div class="page"><button class="back" onclick="home()">← Back</button><h1>📝 Health Notes</h1><label>Note title</label><input id="nt" placeholder="e.g. Blood pressure check"><label>Health note</label><textarea id="nb" placeholder="Write a simple health note..."></textarea><button class="primary" onclick="addNote()">💾 Save Health Note</button>${notes.length?notes.map((n,i)=>`<div class="card"><b>📝 ${n.title}</b><p>${n.body}</p><span class="badge">Saved locally</span></div>`).join(''):'<div class="empty">No health notes yet.</div>'}</div>`}function addNote(){if(!nt.value.trim()||!nb.value.trim())return alert('Enter title and note.');notes.push({title:nt.value,body:nb.value});save();healthNote()}
function specialCare(){M.innerHTML=`<div class="page"><button class="back" onclick="home()">← Back</button><h1>🧡 Special Care</h1><div class="card"><div class="section-title">Personal care needs</div><label>Care need</label><input id="sn" placeholder="e.g. Walking assistance"><label>Instructions</label><textarea id="sb" placeholder="Simple instructions for family/caregiver..."></textarea><button class="primary" onclick="addSpecial()">➕ Save Special Care</button></div>${special.length?special.map(s=>`<div class="card"><b>🧡 ${s.name}</b><p>${s.body}</p></div>`).join(''):'<div class="empty">No special care instructions yet.</div>'}</div>`}function addSpecial(){if(!sn.value.trim())return alert('Enter a care need.');special.push({name:sn.value,body:sb.value||'No instructions added.'});save();specialCare()}
function dailyRoutine(){M.innerHTML=`<div class="page"><button class="back" onclick="home()">← Back</button><h1>📅 Daily Routine</h1><label>Routine activity</label><input id="rn" placeholder="e.g. Morning walk"><label>Time</label><input id="rt" type="time"><button class="primary" onclick="addRoutine()">➕ Add Routine</button>${routine.length?routine.map((r,i)=>`<div class="card"><b>⏰ ${r.time}</b><p>${r.name}</p><span class="badge">Daily routine</span></div>`).join(''):'<div class="empty">No routine activities yet.</div>'}</div>`}function addRoutine(){if(!rn.value.trim())return alert('Enter an activity.');routine.push({name:rn.value,time:rt.value||'08:00'});save();dailyRoutine()}
home();
</script></body></html>
